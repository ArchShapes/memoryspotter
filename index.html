gift:(c,x,y,u,v)=>{rc(c,x-u*.7,y-u*.5,u*1.4,u*1.1,['#ef4444','#3b82f6','#a855f7'][v]);rc(c,x-u*.1,y-u*.5,u*.2,u*1.1,'#fde047');rc(c,x-u*.7,y-u*.65,u*1.4,u*.25,'#fde047',3)},
ball:(c,x,y,u,v)=>{ci(c,x,y,u*.7,['#ef4444','#3b82f6','#22c55e'][v]);c.save();c.beginPath();c.arc(x,y,u*.7,0,7);c.clip();rc(c,x-u*.15,y-u*.7,u*.3,u*1.4,'#fff');c.restore()}
};
/* ---------- 10 compositions x 3 looks (normal, mirrored, sunset) = 30 drawings ---------- */
const S=[
{n:'Meadow',b:[['#bfe3fb',0,290],['#86d98e',290,420]],i:[['sun',90,70,1.3],['cloud',300,60,1.2],['cloud',510,100,1],['tree',130,260,1.5],['tree',560,250,1.3],['house',350,260,1.4],['flower',230,350,.9],['flower',440,360,.9],['flower',60,370,.8],['bird',460,180,.9]]},
{n:'Reef',b:[['#7dd3fc',0,330],['#fde68a',330,420]],i:[['fish',120,90,1],['fish',330,60,1.1],['fish',500,150,1],['fish',210,200,.9],['fish',440,260,1.2],['star',90,370,1],['star',300,375,.9],['star',540,360,1.1]]},
{n:'Space',b:[['#1e1b4b',0,420]],i:[['moon',90,80,1.3],['rocket',330,210,1.5],['ufo',520,90,1.2],['star',200,60,.5],['star',440,40,.5],['star',560,230,.6],['star',120,250,.5],['ball',470,330,1],['star',250,350,.5]]},
{n:'Beach',b:[['#bae6fd',0,200],['#38bdf8',200,290],['#fde68a',290,420]],i:[['sun',540,70,1.2],['cloud',150,70,1.2],['boat',330,230,1.2],['umb',120,320,1.3],['ball',300,350,.8],['star',460,365,.8],['bird',410,110,.8],['cat',560,330,.9]]},
{n:'Desert',b:[['#fed7aa',0,260],['#fcd34d',260,420]],i:[['sun',300,70,1.4],['cactus',90,300,1.1],['cactus',480,310,1.3],['cactus',340,350,.7],['car',230,360,1],['bird',520,130,.8],['cloud',110,90,1]]},
{n:'Party',b:[['#fbcfe8',0,300],['#c4b5fd',300,420]],i:[['balloon',90,110,1],['balloon',200,90,1],['balloon',470,100,1],['balloon',560,140,1],['gift',150,350,1],['gift',330,360,1.1],['gift',510,350,.9],['star',330,90,.9],['cat',420,310,1]]},
{n:'Forest',b:[['#d9f99d',0,270],['#4ade80',270,420]],i:[['tree',90,230,1.6],['tree',250,240,1.3],['tree',420,230,1.5],['tree',570,250,1.3],['mush',160,360,.9],['mush',340,370,1],['mush',500,365,.8],['bird',330,90,.9],['flower',60,380,.7],['sun',560,60,1]]},
{n:'Village',b:[['#bae6fd',0,300],['#a3e635',300,420]],i:[['house',110,260,1.3],['house',300,270,1.5],['house',500,260,1.2],['tree',210,240,1],['car',420,375,1],['cloud',180,70,1.2],['cloud',470,60,1],['sun',570,70,1],['flower',60,380,.7]]},
{n:'Garden',b:[['#e0f2fe',0,290],['#86efac',290,420]],i:[['flower',80,330,1.2],['flower',180,350,1],['flower',290,320,1.2],['flower',400,355,1],['flower',500,330,1.2],['flower',580,360,.9],['cat',340,230,1.2],['bird',130,150,.9],['tree',560,200,1.2],['cloud',280,60,1.3]]},
{n:'Night',b:[['#312e81',0,300],['#1e293b',300,420]],i:[['moon',100,80,1.4],['star',230,60,.5],['star',350,110,.6],['star',460,50,.5],['house',200,330,1.2],['house',460,330,1.3],['cat',330,350,.9],['ufo',540,130,1],['star',560,230,.5]]}
];
let deck=[];const nextDraw=()=>{if(!deck.length)deck=[...Array(30).keys()].sort(()=>R()-.5);return deck.pop()};
function draw(its,sc,look){cx.lineJoin='round';cx.lineCap='round';sc.b.forEach(([c,a,b])=>{cx.fillStyle=c;cx.fillRect(0,a,W,b-a)});its.forEach(o=>o.v>=0&&D[o.t](cx,o.x,o.y,o.s*30,o.v));if(look==2){cx.fillStyle='rgba(255,130,50,.22)';cx.fillRect(0,0,W,H)}}
/* ---------- game ---------- */
let score=0,round=1,best=0,tries=11,streak=0,base,alt,diffs,cur,phase='idle',tmr=null,left=40,found=0,total=0,hbT=null;
try{best=+localStorage.getItem('msBest')||0}catch(e){}
$('best').textContent=best;
function setMsg(t,ic){const m=$('msg');m.innerHTML=ic?IC(ic):'';const s=document.createElement('span');s.textContent=t;m.appendChild(s)}
function clearT(){if(tmr){clearInterval(tmr);tmr=null}}
function stopHB(){clearTimeout(hbT);hbT=null;stg.classList.remove('spot');ret.classList.remove('on')}
function beat(){if(phase!=='spot')return;tone(95,0,.2,'sine',.55,0,42);tone(78,0,.22,'sine',.4,.17,36);
 const k=1-left/40,tc=$('tchip');tc.classList.remove('hb');void tc.offsetWidth;tc.classList.add('hb');hbT=setTimeout(beat,1100-k*620)}
function fx(x,y,cls,t){const b=cv.getBoundingClientRect(),s=stg.getBoundingClientRect(),k=b.width/W,d=document.createElement('div');d.className=cls;d.textContent=t||'';d.style.left=(b.left-s.left-stg.clientLeft+x*k)+'px';d.style.top=(b.top-s.top-stg.clientTop+y*k)+'px';stg.appendChild(d);setTimeout(()=>d.remove(),950)}
function startRound(){
 $('ov').classList.add('hide');const id=nextDraw(),sc=S[id/3|0],look=id%3;cur={sc,look};
 const GB={house:.85,tree:.9,cactus:1,flower:1,cat:1,mush:.6,gift:.6,car:.72,umb:.9},gt=sc.b[sc.b.length-1][1];
 base=sc.i.map(([t,x,y,s],i)=>{const u=s*30,g=GB[t],m=u*1.1+6;
  if(g!=null){const bot=y+g*u;if(bot<gt+10)y+=gt+10+(i*23%40)-bot;y=Math.min(y,H-6-g*u)}else y=Math.min(y,H-m);
  y=Math.max(y,m);x=look==1?W-x:x;x=Math.min(Math.max(x,m),W-m);return{t,x,y,s,v:R()*3|0}});
 total=1+(R()*4|0);const idx=[...base.keys()].sort(()=>R()-.5).slice(0,total);
 alt=base.map(o=>({...o}));
 diffs=idx.map(i=>{const o=alt[i];o.v=(o.v+1+(R()*2|0))%3;return{x:o.x,y:o.y,r:o.s*30+12,found:false}});
 found=0;left=40;streak=0;$('round').textContent=round;$('time').textContent=40;$('tchip').classList.remove('low');
 $('cap').textContent='Drawing '+(id+1)+' / 30 · '+sc.n+['',' (mirrored)',' (sunset)'][look];
 draw(base,sc,look);phase='memo';snd.show();
 let t=10;setMsg('Memorize! '+t+'s','eye');$('pf').style.width='100%';
 clearT();tmr=setInterval(()=>{t-=.1;$('pf').style.width=(t/10*100)+'%';setMsg('Memorize! '+Math.ceil(t)+'s','eye');
  if(t<=0){clearT();hideThenSpot()}},100)
}
function hideThenSpot(){
 phase='blank';snd.hide();cx.fillStyle='#7c3aed';cx.fillRect(0,0,W,H);
 cx.fillStyle='#fff';cx.font='900 36px Nunito,system-ui,sans-serif';cx.textAlign='center';cx.fillText('Get ready…',W/2,H/2);
 setMsg('Get ready…','clock');
 setTimeout(()=>{draw(alt,cur.sc,cur.look);phase='spot';snd.show();stg.classList.add('spot');beat();
  setMsg(`Find ${total} difference${total>1?'s':''}!`,'search');
  let lastSec=40;const st=Date.now();
  tmr=setInterval(()=>{left=Math.max(0,40-(Date.now()-st)/1000);const sec=Math.ceil(left);
   $('time').textContent=sec;$('pf').style.width=(left/40*100)+'%';
   if(sec<=8){$('tchip').classList.add('low');if(sec!==lastSec)snd.tick()}
   lastSec=sec;if(left<=0){clearT();endRound(false)}},100)},1200)
}
function mark(d,ok){cx.lineWidth=5;cx.strokeStyle=ok?'#16a34a':'#e11d48';cx.beginPath();cx.arc(d.x,d.y,d.r,0,7);cx.stroke()}
function endRound(win,why){
 phase='end';clearT();stopHB();
 if(win){snd.win();setMsg('All found! Next round…','spark');setTimeout(()=>{if(phase==='end'){round++;startRound()}},1400)}
 else{snd.lose();diffs.forEach(d=>{if(!d.found){cx.setLineDash([8,6]);mark(d,false);cx.setLineDash([])}});
  if(score>best){best=score;try{localStorage.setItem('msBest',best)}catch(e){}$('best').textContent=best}
  setMsg(why==='tries'?'Out of attempts! Red rings were missed.':'Time up! Red rings were missed.',why==='tries'?'heart':'clock');
  setTimeout(()=>{const o=$('ov');o.querySelector('h1').textContent='Game over: '+score+' pts';
   o.querySelector('p').textContent='You reached round '+round+'. Beat your best!';$('go').textContent='Play again';o.classList.remove('hide');score=0;round=1;$('score').textContent=0},1800)}
}
cv.addEventListener('pointerdown',e=>{
 ac();if(phase!=='spot')return;
 const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width,y=(e.clientY-b.top)*H/b.height;
 const d=diffs.find(d=>!d.found&&Math.hypot(d.x-x,d.y-y)<d.r);
 if(d){d.found=true;found++;score++;streak++;$('score').textContent=score;mark(d,true);snd.ding(streak-1);fx(d.x,d.y,'burst');fx(d.x,d.y,'pop','+1');
  setMsg((found<total?`${total-found} left!`:'Perfect!')+(streak>1?` Streak x${streak}`:''),'check');
  if(found===total)endRound(true)}
 else{snd.bad();streak=0;tries--;$('tries').textContent=tries;cv.classList.remove('shake');void cv.offsetWidth;cv.classList.add('shake');fx(x,y,'pop bad','-1');
  cx.strokeStyle='rgba(225,29,72,.9)';cx.lineWidth=6;cx.beginPath();cx.moveTo(x-12,y-12);cx.lineTo(x+12,y+12);cx.moveTo(x+12,y-12);cx.lineTo(x-12,y+12);cx.stroke();
  const snap=phase;setTimeout(()=>{if(phase===snap){draw(alt,cur.sc,cur.look);diffs.forEach(d=>d.found&&mark(d,true))}},350);
  if(tries<=0)endRound(false,'tries');else setMsg(`Wrong! ${tries} attempt${tries>1?'s':''} left`,'heart')}
});
$('go').onclick=()=>{ac();round=1;score=0;tries=11;$('tries').textContent=11;$('score').textContent=0;startRound()};
stg.addEventListener('pointermove',e=>{if(phase!=='spot'){ret.classList.remove('on');return}const b=stg.getBoundingClientRect();ret.style.left=(e.clientX-b.left-stg.clientLeft)+'px';ret.style.top=(e.clientY-b.top-stg.clientTop)+'px';ret.classList.add('on')});
stg.addEventListener('pointerleave',()=>ret.classList.remove('on'));
stg.addEventListener('pointerdown',()=>{ret.classList.add('down');setTimeout(()=>ret.classList.remove('down'),150)});
cx.fillStyle='#c4b5fd';cx.fillRect(0,0,W,H);
</script></body></html>
